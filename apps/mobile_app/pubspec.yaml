name: mobile_app
description: "ISUFST GSO Management Portal — Mobile App"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.8.4

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # UI & Icons
  cupertino_icons: ^1.0.8
  syncfusion_flutter_calendar: ^32.1.23
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17

  # Forms & Validation
  flutter_form_builder: ^10.3.0
  form_builder_validators: ^11.1.2

  # Utilities
  intl: ^0.20.2
  timeago: ^3.7.0
  collection: ^1.19.1
  equatable: ^2.0.7
  uuid: ^4.5.1

  # Image & File
  image_picker: ^1.1.2
  file_picker: ^8.3.7

  # Notifications
  firebase_core: ^3.13.1
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^18.0.1

  # Storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # URL / Deep Linking
  url_launcher: ^6.3.1

  # HTTP (for edge function calls)
  http: ^1.3.0

  # Onboarding


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.4
  json_serializable: ^6.9.4
  json_annotation: ^4.9.0

  # Launcher Icons
  flutter_launcher_icons: ^0.14.1

  # Native Splash
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#ffffff"
  image: "assets/images/logo.png"
  android_12:
    image: "assets/images/logo.png"
    color: "#ffffff"
  fullscreen: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  #   - assets/icons/
  #   - assets/animations/
